<html lang="en">
<head>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--jj-paper);
    color: var(--jj-ink);
    font-family: var(--jj-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }
  :root {
    --jj-display: "Helvetica Neue", "Inter", "Arial", sans-serif;
    --jj-body:    "Helvetica Neue", "Inter", "Arial", sans-serif;
  }
  button, input, textarea { font-family: inherit; }

  /* Hover state */
  .jj-pill, button.jj-choice, button:not([disabled]) {
    transition: opacity 140ms var(--jj-ease), transform 100ms var(--jj-ease), background 140ms var(--jj-ease);
  }
  .jj-pill:hover, button:not([disabled]):hover { opacity: 0.78; }
  button:not([disabled]):active { transform: scale(0.98); }
  button.jj-choice:hover { opacity: 1; transform: translateY(-2px); }
  button.jj-choice:hover h3 { opacity: 0.85; }

  /* Focus */
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--jj-ink);
    outline-offset: 2px;
    border-radius: 2px;
  }

  /* Pulsing "open" dot */
  @keyframes jj-pulse {
    0%   { box-shadow: 0 0 0 0   rgba(110, 231, 183, 0.7); }
    70%  { box-shadow: 0 0 0 10px rgba(110, 231, 183, 0); }
    100% { box-shadow: 0 0 0 0   rgba(110, 231, 183, 0); }
  }
  .jj-pulse-dot {
    animation: jj-pulse 2s infinite;
    flex-shrink: 0;
  }

  /* Page-load reveal helpers */
  @keyframes jj-rise {
    from { transform: translateY(28%); opacity: 0; }
    to   { transform: translateY(0);   opacity: 1; }
  }
  @keyframes jj-fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Background wireframe paths — slow drift.
     This animates transform on a plain div, not stroke-dashoffset on the SVG
     strokes. Dash-offset is a paint property: it forced a full repaint and
     re-raster of the whole layer every single frame (measured: ~900ms of
     raster work per 5s, a repaint on all 300 frames). transform is a
     compositor property, so the drift now costs no repaint at all. */
  @keyframes jj-path-drift {
    from { transform: translate3d(-1.7%, 1.3%, 0); }
    to   { transform: translate3d(1.7%, -1.3%, 0); }
  }
  .jj-paths-drift {
    position: absolute;
    inset: -7%;
    will-change: transform;
    animation: jj-path-drift 30s ease-in-out infinite alternate;
  }
  @media (prefers-reduced-motion: reduce) {
    .jj-paths-drift { animation: none; }
  }

  /* World map. SMIL (<animate>, <animateMotion>) invalidates SVG geometry, so
     it forced a full Layout on every frame for as long as the map was on
     screen — measured at 300 layouts per 5s with a 23ms spike, which is what
     made the logo marquee on the same page stutter. Replacements below use
     only CSS, and only properties that do not touch layout. */

  /* Route arcs are drawn statically. A dash-offset "draw-in" was tried here
     and reverted: its resting state is an invisible stroke, so any failure to
     run the animation leaves the routes missing entirely — the same
     hidden-by-default trap that hid the background paths. Solid strokes
     always render, and cost nothing per frame. */

  /* Pulse ring. Deliberately an HTML div overlaid on the map, not an SVG
     circle: a CSS transform on an SVG element is not composited in Chromium
     and still forced a Layout on every frame (measured: 236 layouts per 5s,
     which vanished the moment this animation was switched off). On a plain
     div, transform + opacity are compositor-only and cost nothing. */
  @keyframes jj-ping {
    0%   { transform: translate(-50%, -50%) scale(1);   opacity: 0.55; }
    70%  { transform: translate(-50%, -50%) scale(4.2); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(4.2); opacity: 0; }
  }
  .jj-ping-dot {
    position: absolute;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: #6EE7B7;
    pointer-events: none;
    transform: translate(-50%, -50%);
    will-change: transform, opacity;
    animation: jj-ping 2.8s var(--jj-ease-out) infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .jj-ping-dot { animation: none; opacity: 0.4; }
  }

  /* Collapsible section (Send a message) — animates open/closed height
     without measuring content, so it stays correct as content changes. */
  .jj-collapse {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 320ms var(--jj-ease);
  }
  .jj-collapse.jj-collapse--open { grid-template-rows: 1fr; }
  .jj-collapse > div { overflow: hidden; min-height: 0; }

  /* Company strip marquee. translate3d keeps it on its own compositor layer
     so the scroll never depends on main-thread work. */
  @keyframes jj-marquee {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(-50%, 0, 0); }
  }
  .jj-marquee:hover { animation-play-state: running; }
  .jj-marquee--locked { animation-play-state: running !important; pointer-events: none; }

  /* Print: only the CV section */
  @page { size: A4; margin: 8mm; }
  @media print {
    html, body { background: white; }
    .jj-pill, button { display: none !important; }
  }
</style>

<body>
