<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--jj-paper);
    font-family: "Helvetica Neue", "Inter", "Arial", sans-serif;
    color: var(--jj-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { width: 700px; min-height: 220px; padding: 22px 26px; display: flex; flex-direction: column; }
  .star { font-size: 1.05em; line-height: 1; display: inline-block; }
  .eyebrow { font-size: 9px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--jj-muted); }
  .label  { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--jj-muted); }
  .mono   { font-family: ui-monospace, "SF Mono", monospace; font-size: 10px; color: var(--jj-muted); }
  
</style></head><body>
    <div class="eyebrow" style="margin-bottom:18px">Eyebrow labels · uppercase &amp; tracked</div>
    <div style="display:flex;flex-direction:column;gap:14px;flex:1">
      <div style="display:flex;align-items:baseline;gap:16px;border-bottom:1px solid rgba(0,0,0,0.08);padding-bottom:10px">
        <span style="font-size:10px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase">Open to senior international roles</span>
        <span class="mono" style="margin-left:auto">10/500 · 0.16em</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:16px;border-bottom:1px solid rgba(0,0,0,0.08);padding-bottom:10px">
        <span style="font-size:9px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:var(--jj-muted)">Education &amp; certifications</span>
        <span class="mono" style="margin-left:auto">9/500 · 0.22em</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:16px">
        <span style="font-size:8.5px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:var(--jj-muted)">Location · Phone · Email</span>
        <span class="mono" style="margin-left:auto">8.5/500 · 0.22em</span>
      </div>
    </div>
  </body></html>
