<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--jj-paper);
    font-family: "Helvetica Neue", "Inter", "Arial", sans-serif;
    color: var(--jj-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { width: 700px; min-height: 240px; padding: 22px 26px; display: flex; flex-direction: column; }
  .star { font-size: 1.05em; line-height: 1; display: inline-block; }
  .eyebrow { font-size: 9px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--jj-muted); }
  .label  { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--jj-muted); }
  .mono   { font-family: ui-monospace, "SF Mono", monospace; font-size: 10px; color: var(--jj-muted); }
  
</style></head><body>
    <div class="eyebrow" style="margin-bottom:14px">Section head · numeral does the work icons would do</div>
    <div style="background:#fff;border-radius:18px;padding:18px 28px 22px">
      <div style="display:flex;justify-content:flex-end;margin-bottom:4px">
        <div style="font-weight:700;font-size:30px;line-height:0.9;letter-spacing:-0.04em">03</div>
      </div>
      <h2 style="font-weight:700;font-size:22px;line-height:1;letter-spacing:-0.025em;margin-bottom:6px">
        Professional <span style="color:var(--jj-muted)">experience.</span>
      </h2>
      <p style="font-size:11px;line-height:1.4;color:var(--jj-ink-2);max-width:60ch">
        Fifteen years of senior finance leadership across power, renewables, wind, and clean technology.
      </p>
    </div>
    <div style="font-size:10px;color:var(--jj-muted);line-height:1.5;margin-top:10px">
      Big section numeral, flush right. H2 + soft modifier in muted gray. Period at end of phrase is intentional.
    </div>
  </body></html>
