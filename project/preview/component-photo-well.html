<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--jj-paper);
    font-family: "Helvetica Neue", "Inter", "Arial", sans-serif;
    color: var(--jj-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { width: 700px; min-height: 200px; padding: 22px 26px; display: flex; flex-direction: column; }
  .star { font-size: 1.05em; line-height: 1; display: inline-block; }
  .eyebrow { font-size: 9px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--jj-muted); }
  .label  { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--jj-muted); }
  .mono   { font-family: ui-monospace, "SF Mono", monospace; font-size: 10px; color: var(--jj-muted); }
  
</style></head><body>
    <div class="eyebrow" style="margin-bottom:14px">Photo well · ink-bordered circle</div>
    <div style="display:flex;gap:24px;align-items:center;flex:1">
      <div style="width:96px;height:96px;border-radius:50%;border:1px solid #0A0A0A;background:#E9E5DD;display:grid;place-items:center;font-weight:700;font-size:30px;letter-spacing:-0.02em">JJ</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600;margin-bottom:6px">96 ⌀ · 1px ink border · warm fill</div>
        <div style="font-size:10.5px;line-height:1.5;color:var(--jj-ink-2);max-width:38ch">
          The only photographic mark on the page. Cool / neutral headshot, no filters. Initials fallback when no photo is provided.
        </div>
      </div>
    </div>
  </body></html>
