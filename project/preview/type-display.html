<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--jj-paper);
    font-family: "Helvetica Neue", "Inter", "Arial", sans-serif;
    color: var(--jj-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { width: 700px; min-height: 320px; padding: 22px 26px; display: flex; flex-direction: column; }
  .star { font-size: 1.05em; line-height: 1; display: inline-block; }
  .eyebrow { font-size: 9px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--jj-muted); }
  .label  { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--jj-muted); }
  .mono   { font-family: ui-monospace, "SF Mono", monospace; font-size: 10px; color: var(--jj-muted); }
  
</style></head><body>
    <div class="eyebrow" style="margin-bottom:18px">Display · Helvetica Neue 700 · tight tracking</div>
    <div style="display:flex;flex-direction:column;gap:12px;flex:1">
      <div style="display:flex;align-items:baseline;gap:16px;border-bottom:1px solid rgba(0,0,0,0.08);padding-bottom:10px">
        <span style="font-size:84px;font-weight:700;letter-spacing:-0.06em;line-height:0.82">2026</span>
        <span class="mono" style="margin-left:auto">100/0.82 · ‑0.06em</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:16px;border-bottom:1px solid rgba(0,0,0,0.08);padding-bottom:10px">
        <span style="font-size:42px;font-weight:700;letter-spacing:-0.04em;line-height:0.92">Chief Financial Officer.</span>
        <span class="mono" style="margin-left:auto">44/0.92 · ‑0.04em</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:16px">
        <span style="font-size:22px;font-weight:700;letter-spacing:-0.025em">Areas of <span style="color:var(--jj-muted)">expertise.</span></span>
        <span class="mono" style="margin-left:auto">22/1 · ‑0.025em</span>
      </div>
    </div>
  </body></html>
