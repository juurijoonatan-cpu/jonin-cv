<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--jj-paper);
    font-family: "Helvetica Neue", "Inter", "Arial", sans-serif;
    color: var(--jj-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { width: 700px; min-height: 320px; padding: 22px 26px; display: flex; flex-direction: column; }
  .star { font-size: 1.05em; line-height: 1; display: inline-block; }
  .eyebrow { font-size: 9px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--jj-muted); }
  .label  { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--jj-muted); }
  .mono   { font-family: ui-monospace, "SF Mono", monospace; font-size: 10px; color: var(--jj-muted); }
  
</style></head><body>
    <div class="eyebrow" style="margin-bottom:18px">Form field · understated, no boxes</div>
    <div style="display:flex;flex-direction:column;gap:24px;max-width:360px;flex:1">
      <div>
        <div style="font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--jj-muted);margin-bottom:8px">Email</div>
        <div style="border-bottom:1px solid #0A0A0A;padding:8px 0 10px;font-size:16px;color:#0A0A0A">joni@juuri.me</div>
      </div>
      <div>
        <div style="font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--jj-muted);margin-bottom:8px">Password</div>
        <div style="border-bottom:1px solid #0A0A0A;padding:8px 0 10px;font-size:16px;color:#0A0A0A;letter-spacing:0.3em">••••••••</div>
        <div style="font-size:10px;color:var(--jj-muted);margin-top:8px">Demo password: juuri2026</div>
      </div>
    </div>
    <div style="font-size:10px;color:var(--jj-muted);line-height:1.5;margin-top:12px">
      Single bottom rule. No padded box. Label is an eyebrow above. Error state turns the rule red <span class="mono">#C84343</span>.
    </div>
  </body></html>
