<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--jj-paper);
    font-family: "Helvetica Neue", "Inter", "Arial", sans-serif;
    color: var(--jj-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { width: 700px; min-height: 260px; padding: 22px 26px; display: flex; flex-direction: column; }
  .star { font-size: 1.05em; line-height: 1; display: inline-block; }
  .eyebrow { font-size: 9px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--jj-muted); }
  .label  { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--jj-muted); }
  .mono   { font-family: ui-monospace, "SF Mono", monospace; font-size: 10px; color: var(--jj-muted); }
  
</style></head><body>
    <div class="eyebrow" style="margin-bottom:14px">Section card · light, dark, mixed</div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1">
      <div style="background:#fff;border-radius:18px;padding:14px 22px;font-size:11px;color:var(--jj-ink-2)">Light card · #FFFFFF · radius 18</div>
      <div style="background:#0A0A0A;color:#fff;border-radius:18px;padding:14px 22px;font-size:11px">Dark card · #0A0A0A · radius 18</div>
      <div style="background:#F4F2EE;border-radius:24px;padding:14px 22px;font-size:11px;color:var(--jj-ink-2)">Feature card · #F4F2EE · radius 24</div>
      <div style="background:#DCD9D3;border-radius:24px;padding:14px 22px;font-size:11px;color:var(--jj-ink)">Stone feature · #DCD9D3 · radius 24</div>
    </div>
    <div style="font-size:10px;color:var(--jj-muted);line-height:1.5;margin-top:10px">
      Cards stack vertically with 5–6px gaps. No drop shadows — depth is paper-on-paper layering only.
    </div>
  </body></html>
