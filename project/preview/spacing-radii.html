<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--jj-paper);
    font-family: "Helvetica Neue", "Inter", "Arial", sans-serif;
    color: var(--jj-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { width: 700px; min-height: 220px; padding: 22px 26px; display: flex; flex-direction: column; }
  .star { font-size: 1.05em; line-height: 1; display: inline-block; }
  .eyebrow { font-size: 9px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--jj-muted); }
  .label  { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--jj-muted); }
  .mono   { font-family: ui-monospace, "SF Mono", monospace; font-size: 10px; color: var(--jj-muted); }
  
</style></head><body>
    <div class="eyebrow" style="margin-bottom:14px">Corner radii</div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;flex:1">
      
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <div style="width:100%;aspect-ratio:1.2/1;background:#fff;border:1px solid rgba(0,0,0,0.12);border-radius:999px"></div>
          <span style="font-size:10px;font-weight:600">999px</span>
          <span class="mono">Pills</span>
        </div>
      
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <div style="width:100%;aspect-ratio:1.2/1;background:#fff;border:1px solid rgba(0,0,0,0.12);border-radius:18px"></div>
          <span style="font-size:10px;font-weight:600">18px</span>
          <span class="mono">Sections</span>
        </div>
      
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <div style="width:100%;aspect-ratio:1.2/1;background:#fff;border:1px solid rgba(0,0,0,0.12);border-radius:28px"></div>
          <span style="font-size:10px;font-weight:600">28px</span>
          <span class="mono">Mobile</span>
        </div>
      
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <div style="width:100%;aspect-ratio:1.2/1;background:#fff;border:1px solid rgba(0,0,0,0.12);border-radius:24px"></div>
          <span style="font-size:10px;font-weight:600">24px</span>
          <span class="mono">Feature</span>
        </div>
      
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <div style="width:100%;aspect-ratio:1.2/1;background:#fff;border:1px solid rgba(0,0,0,0.12);border-radius:8px"></div>
          <span style="font-size:10px;font-weight:600">8px</span>
          <span class="mono">Stat block</span>
        </div>
      
    </div>
  </body></html>
