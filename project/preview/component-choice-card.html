<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--jj-paper);
    font-family: "Helvetica Neue", "Inter", "Arial", sans-serif;
    color: var(--jj-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { width: 700px; min-height: 280px; padding: 22px 26px; display: flex; flex-direction: column; }
  .star { font-size: 1.05em; line-height: 1; display: inline-block; }
  .eyebrow { font-size: 9px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--jj-muted); }
  .label  { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--jj-muted); }
  .mono   { font-family: ui-monospace, "SF Mono", monospace; font-size: 10px; color: var(--jj-muted); }
  
</style></head><body>
    <div class="eyebrow" style="margin-bottom:14px">Choice card · landing gate</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1">
      <div style="background:#fff;border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;min-height:200px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <span style="font-size:9px;letter-spacing:0.16em;text-transform:uppercase;font-weight:500">01 · The story</span>
          <div style="width:24px;height:24px;border:1px solid #0A0A0A;border-radius:50%;display:grid;place-items:center;font-size:10px">↗</div>
        </div>
        <div>
          <h3 style="font-weight:700;font-size:32px;line-height:0.92;letter-spacing:-0.04em;margin:0">The story.</h3>
          <p style="font-size:10.5px;color:var(--jj-ink-2);margin-top:8px;line-height:1.4">Short biographical view. Open to anyone.</p>
        </div>
      </div>
      <div style="background:#0A0A0A;color:#fff;border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;min-height:200px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <span style="font-size:9px;letter-spacing:0.16em;text-transform:uppercase;font-weight:500;color:rgba(255,255,255,0.55)">02 · The CV</span>
          <div style="width:24px;height:24px;border:1px solid #fff;border-radius:50%;display:grid;place-items:center">
            <svg width="9" height="11" viewBox="0 0 11 13" fill="none"><rect x="0.75" y="5.75" width="9.5" height="6.5" rx="0.5" stroke="#fff" stroke-width="1.2"/><path d="M2.5 5.5V3.5C2.5 1.84315 3.84315 0.5 5.5 0.5C7.15685 0.5 8.5 1.84315 8.5 3.5V5.5" stroke="#fff" stroke-width="1.2"/></svg>
          </div>
        </div>
        <div>
          <h3 style="font-weight:700;font-size:32px;line-height:0.92;letter-spacing:-0.04em;margin:0">The CV.</h3>
          <p style="font-size:10.5px;color:rgba(255,255,255,0.75);margin-top:8px;line-height:1.4">Full document. Email + password required.</p>
        </div>
      </div>
    </div>
  </body></html>
