<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--jj-paper);
    font-family: "Helvetica Neue", "Inter", "Arial", sans-serif;
    color: var(--jj-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { width: 700px; min-height: 320px; padding: 22px 26px; display: flex; flex-direction: column; }
  .star { font-size: 1.05em; line-height: 1; display: inline-block; }
  .eyebrow { font-size: 9px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--jj-muted); }
  .label  { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--jj-muted); }
  .mono   { font-family: ui-monospace, "SF Mono", monospace; font-size: 10px; color: var(--jj-muted); }
  
</style></head><body>
    <div class="eyebrow" style="margin-bottom:18px">Borders &amp; rules</div>
    <div style="display:flex;flex-direction:column;gap:14px;flex:1">
      <div>
        <div style="font-size:10.5px;font-weight:600;margin-bottom:6px">Hairline rule on light</div>
        <div style="height:1px;background:rgba(0,0,0,0.12)"></div>
        <div class="mono" style="margin-top:4px">1px · rgba(0,0,0,0.12)</div>
      </div>
      <div style="background:#0A0A0A;color:#fff;border-radius:12px;padding:14px 16px">
        <div style="font-size:10.5px;font-weight:600;margin-bottom:6px;color:#fff">Hairline rule on dark</div>
        <div style="height:1px;background:rgba(255,255,255,0.18)"></div>
        <div style="font-family:ui-monospace,'SF Mono',monospace;font-size:10px;color:rgba(255,255,255,0.55);margin-top:4px">1px · rgba(255,255,255,0.18)</div>
      </div>
      <div>
        <div style="font-size:10.5px;font-weight:600;margin-bottom:6px">Ink border (pills, photo well)</div>
        <div style="display:flex;gap:10px;align-items:center">
          <div style="border:1px solid #0A0A0A;border-radius:999px;padding:5px 12px;font-size:9px;letter-spacing:0.18em;text-transform:uppercase">CV</div>
          <div style="width:32px;height:32px;border:1px solid #0A0A0A;border-radius:50%"></div>
          <span class="mono" style="margin-left:auto">1px solid #0A0A0A</span>
        </div>
      </div>
    </div>
  </body></html>
